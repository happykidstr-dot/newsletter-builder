[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  PUBLISH_VERIFICATION_PROVIDER = "native"
  NEXT_PUBLIC_PUBLISH_VERIFICATION_PROVIDER = "native"
  ENABLE_ANONYMOUS_PUBLISHING = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Old static/HTML links may point to index.html. The Next.js 16 app homepage
# is /, not /index.html. Redirect old bookmarks before Next returns its 404.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
