name: Visual Template Gallery Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gallery-build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Gallery contract checks
        run: npm run test:gallery
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser gallery scenarios
        run: npm run test:gallery:e2e
      - name: Save tablet screenshots for visual verification
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: tablet-visual-checks
          path: test-results/tablet-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify live Netlify Deploy Preview publishing
        if: github.event_name == 'pull_request'
        timeout-minutes: 6
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bultenoku.netlify.app
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-public-preview.mjs
