name: Check BULTEN READ production deployment

on:
  push:
    branches: [main]
    paths:
      - "scripts/verify-live-deployment.mjs"
      - ".github/workflows/production-health.yml"
      - "app/**"
      - "lib/**"
      - "netlify/**"
      - "package.json"
      - "netlify.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live Netlify site and publication endpoint
        run: node scripts/verify-live-deployment.mjs
